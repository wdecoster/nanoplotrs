# Dependabot configuration.
# Tuned per GitHub's "tame Dependabot" guidance: batch version updates into a
# few grouped PRs on a slow (monthly) cadence, with a release cooldown. Security
# updates ignore groups/schedule and still open immediately.

version: 2
updates:
  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    reviewers:
      - "wdecoster"
    assignees:
      - "wdecoster"
    commit-message:
      prefix: "cargo"
      include: "scope"
    # Minor+patch land together; majors are grouped separately so one breaking
    # bump can't wedge the routine batch.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
    # Wait a few days after a release before opening a version-update PR, so a
    # compromised fresh release has time to be flagged.
    cooldown:
      default-days: 7
    # resvg / usvg / tiny-skia are pinned as a coupled set by svg2pdf, whose
    # latest release (0.13) still requires usvg ^0.45 / resvg ^0.45 /
    # tiny-skia ^0.11.4. The PNG (resvg) and PDF (svg2pdf) paths share one
    # usvg::Tree, so these cannot move past 0.45/0.11 until svg2pdf updates.
    # Remove these ignores once a svg2pdf release supports usvg >= 0.47.
    ignore:
      - dependency-name: "usvg"
        versions: [">= 0.46"]
      - dependency-name: "resvg"
        versions: [">= 0.46"]
      - dependency-name: "tiny-skia"
        versions: [">= 0.12"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "wdecoster"
    assignees:
      - "wdecoster"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
