name: svg2pdf usvg watch

# resvg / usvg / tiny-skia are held back (see .github/dependabot.yml) because
# svg2pdf 0.13 pins usvg ^0.45 and the PNG (resvg) and PDF (svg2pdf) paths share
# one usvg::Tree. This job checks monthly whether the latest svg2pdf release has
# moved to usvg >= 0.47, and opens an issue when it has so the graphics stack can
# be bumped as a set.

on:
  schedule:
    # 1st of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-svg2pdf:
    name: Check svg2pdf usvg requirement
    runs-on: ubuntu-latest

    steps:
      - name: Query crates.io for latest svg2pdf usvg requirement
        id: check
        run: |
          python3 <<'PY'
          import json, os, re, urllib.request

          UA = {"User-Agent": "nanoplotrs-svg2pdf-watch (github actions)"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          crate = get("https://crates.io/api/v1/crates/svg2pdf")
          # crates.io returns versions newest-first; take the latest non-yanked.
          latest = next(v["num"] for v in crate["versions"] if not v["yanked"])
          deps = get(f"https://crates.io/api/v1/crates/svg2pdf/{latest}/dependencies")
          usvg = next((d for d in deps["dependencies"]
                       if d["crate_id"] == "usvg" and d["kind"] == "normal"), None)
          req = usvg["req"] if usvg else "none"

          m = re.search(r"(\d+)\.(\d+)", req or "")
          minor = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          supported = usvg is not None and minor >= (0, 47)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"latest={latest}\n")
              f.write(f"usvg_req={req}\n")
              f.write(f"supported={'true' if supported else 'false'}\n")
          print(f"svg2pdf latest={latest}  usvg req={req}  supports usvg>=0.47: {supported}")
          PY

      - name: Open issue when svg2pdf supports usvg >= 0.47
        if: steps.check.outputs.supported == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const usvgReq = '${{ steps.check.outputs.usvg_req }}';

            const title = '⬆️ svg2pdf now supports usvg >= 0.47 — bump graphics stack';
            const body = `svg2pdf **${latest}** now requires \`usvg ${usvgReq}\`, so the held-back graphics crates can finally move together.

            ## What to do
            1. Bump in \`Cargo.toml\` as a set: \`resvg\`, \`usvg\`, \`tiny-skia\` (and \`svg2pdf\` to ${latest}).
            2. \`cargo update -p resvg -p usvg -p tiny-skia -p svg2pdf\`.
            3. Fix any type mismatches in \`src/plots/mod.rs\` (the PNG resvg path and PDF svg2pdf path share one \`usvg::Tree\`).
            4. Remove the \`resvg\` / \`usvg\` / \`tiny-skia\` \`ignore\` entries from \`.github/dependabot.yml\`.
            5. Delete this watcher workflow (\`.github/workflows/svg2pdf-watch.yml\`) once done.

            _Filed automatically by the svg2pdf usvg watch on ${new Date().toISOString().slice(0, 10)}._`;

            // De-duplicate against an existing open issue from this watcher.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,svg2pdf',
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dependencies', 'automated', 'svg2pdf'],
              });
              core.info('Opened tracking issue.');
            } else {
              core.info(`Issue already open: #${existing.data[0].number}`);
            }
