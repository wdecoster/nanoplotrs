name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux, linux-musl, macos]
        include:
          - name: linux
            os: ubuntu-latest
            artifact_name: target/release/nanoplot
            asset_name: nanoplot-linux
          - name: linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: target/x86_64-unknown-linux-musl/release/nanoplot
            asset_name: nanoplot-linux-musl
            use_cross: true
          - name: macos
            os: macos-latest
            artifact_name: target/release/nanoplot
            asset_name: nanoplot-macos

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # htslib (via rust-htslib) needs these C libraries for the gnu-Linux build.
      # The musl build links them statically inside the cross image; macOS uses
      # the bundled build from the SDK toolchain.
      - name: Install system dependencies (Linux gnu)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libbz2-dev liblzma-dev zlib1g-dev libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (standard)
        if: '!matrix.use_cross'
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --locked

      - name: Build (cross / musl static)
        if: matrix.use_cross
        run: LIBZ_SYS_STATIC=1 cross build --target ${{ matrix.target }} --release --locked

      - name: Verify musl binary is static
        if: matrix.use_cross
        run: |
          file ${{ matrix.artifact_name }}
          ldd ${{ matrix.artifact_name }} || true

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
